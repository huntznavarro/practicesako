<!<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Looping Example</title>
</head>
<body>
  <h2>List of Numbers (1 to 10)</h2>
  <ul id="numberList"></ul>

  <script>
    // Get the <ul> element by its ID
    const listElement = document.getElementById('numberList');

    // Loop from 1 to 10
    for (let i = 1; i <= 10; i++) {
      // Create a new <li> element
      const listItem = document.createElement('li');
      // Set the text inside the <li>
      listItem.textContent = `Number ${i}`;
      // Add the <li> to the <ul>
      listElement.appendChild(listItem);
    }
  </script>
</body>
</html>
