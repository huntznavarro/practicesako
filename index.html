<!DOCTYPE html>
<html>
<head>
    <title>Loop Example</title>
</head>
<body>

<h2>Numbers from 1 to 5:</h2>
<div id="output"></div>

<script>
    let output = '';
    for (let i = 1; i <= 5; i++) {
        output += i + "<br>";
    }
    document.getElementById("output").innerHTML = output;
</script>

</body>
</html>
